schema: spec-driven

# Project context
context: |
  Development is managed using OpenSpec for planning and task specifications,
  and Serena MCP for semantic code intelligence, LSP operations, and project memories.
  All proposed features must support modular, multi-user, and cost-efficient operation (favoring zero-cost infrastructure and minimal ban risk).

# Per-artifact rules
rules:
  proposal:
    - Include ban risk assessment and hosting/service cost implications
  tasks:
    - Include unit/integration tests with pytest
