[project]
name = "ziox"
version = "0.1.0"
description = "AI Fact-Checking, Advocacy & Engagement Agent for X (Twitter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.1.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pip==26.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
