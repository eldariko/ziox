[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ziox"
version = "0.1.0"
description = "AI Fact-Checking, Advocacy & Engagement Agent for X (Twitter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.1.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "twikit>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "engine*", "database*", "providers*"]
exclude = ["assets*", "tests*", "docs*", "scripts*"]

[tool.setuptools]
py-modules = ["main"]
